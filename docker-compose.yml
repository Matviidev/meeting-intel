services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum
      POSTGRES_DB: quorum
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quorum -d quorum -h 127.0.0.1']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
